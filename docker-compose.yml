version: '3.8'

services:
  # 🗄️ Database MySQL
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: multi_gateways
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔌 Gateway's Mocks
  gateways_mock:
    image: matheusprotzen/gateways-mock
    container_name: payment_mocks
    ports:
      - "3001:3001"
      - "3002:3002"

  # 🚀 Your AdonisJS Backend
  app:
    build: .
    container_name: adonis_app
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - APP_KEY=WOJOyNgJ8mIV7NTmJY869RHR6Ukt-jiN
      - LOG_LEVEL=info
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
      # ------------------------------
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=multi_gateways
      # ⚠️ KEY: Here we tell the app to look for the mocks by the service name
      - GATEWAY_1_URL=http://gateways_mock:3001
      - GATEWAY_2_URL=http://gateways_mock:3002
    # This command make sure DB is ready before start
    command: >
      sh -c "sleep 10 && 
             node build/ace migration:run --force && 
             node build/ace db:seed && 
             node build/bin/server.js"
    depends_on:
      db:
        condition: service_healthy
      gateways_mock:
        condition: service_started
